title = "Vartola gitleaks configuration"

# Keep the default gitleaks rules, and add one narrow allowlist for a public test vector.
[extend]
useDefault = true

[allowlist]
description = "Public test vectors, demo seed data and empty example variables are not credentials"
regexes = [
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
  '''OPENAI_API_KEY=""''',
]
paths = [
  '''prisma/seed-realistic-demo\.ts''',
  '''docs/ai-features\.md''',
]
